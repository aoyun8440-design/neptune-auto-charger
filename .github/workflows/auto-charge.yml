name: Neptune Auto Resume

on:
  # 北京时间 05:55 预检查，失败后在 06:05、06:15、06:25 重试。
  # 使用非整点附近的分钟，降低 GitHub 定时任务排队约一小时的概率。
  schedule:
    - cron: "55 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-auto-resume
  cancel-in-progress: false

jobs:
  auto-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEPTUNE_OPEN_ID: ${{ secrets.NEPTUNE_OPEN_ID }}
      NEPTUNE_EMPLOYEE_ID: ${{ secrets.NEPTUNE_EMPLOYEE_ID }}
      NEPTUNE_AREA_ID: ${{ vars.NEPTUNE_AREA_ID || '6' }}
      NEPTUNE_DRY_RUN: ${{ vars.NEPTUNE_DRY_RUN || 'true' }}
      NEPTUNE_MAX_CHARGE_TIME: ${{ vars.NEPTUNE_MAX_CHARGE_TIME || '480' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v

      - name: Check and resume charging
        run: python main.py
